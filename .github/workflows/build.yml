name: Build Crux Client Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload-to:
        description: 'Repo to upload artifacts to (e.g. Dev-Reds/website-nuxt)'
        required: false
        default: ''
      release-tag:
        description: 'Release tag to upload to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      tag:
        description: 'Release-Tag für Build + Upload (z. B. v1.2.1)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --win --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: Crux-Client-Windows
          path: |
            installer/Crux-Client-Installer.exe

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rpm build tools (fpm needs rpmbuild)
        run: sudo apt-get update -qq && sudo apt-get install -y rpm
      - run: npm ci
      - run: npx electron-builder --linux --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: Crux-Client-Linux
          path: |
            installer/Crux-Client-Linux-x64.AppImage
            installer/Crux-Client-Linux-x64.deb
            installer/Crux-Client-Linux-x64.rpm
            installer/Crux-Client-Linux-x64.zip
            installer/Crux-Client-Linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --mac --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: Crux-Client-Mac
          path: |
            installer/Crux-Client-Mac-x64.dmg
            installer/Crux-Client-Mac-x64.zip

  create-release-zip:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Crux-Client-*
          merge-multiple: true
      - name: Create release zip
        run: |
          mkdir -p release
          mv *.exe release/ 2>/dev/null || true
          mv *.zip release/ 2>/dev/null || true
          mv *.tar.gz release/ 2>/dev/null || true
          mv *.dmg release/ 2>/dev/null || true
          mv *.AppImage release/ 2>/dev/null || true
          mv *.deb release/ 2>/dev/null || true
          mv *.rpm release/ 2>/dev/null || true
          cd release
          zip -9 -r ../Crux-Client-Installer-All.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: Crux-Client-Installer-All
          path: Crux-Client-Installer-All.zip

  upload-to-release:
    needs: [create-release-zip]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Crux-Client-Installer-All
      - uses: actions/download-artifact@v4
        with:
          name: Crux-Client-Windows
      - uses: actions/download-artifact@v4
        with:
          name: Crux-Client-Linux
      - uses: actions/download-artifact@v4
        with:
          name: Crux-Client-Mac
      - name: Upload to Release (crux-client)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: |
            Crux-Client-Installer-All.zip
            *.exe
            *.zip
            *.tar.gz
            *.dmg
            *.AppImage
            *.deb
            *.rpm
          fail_on_unmatched_files: false

  verify-release-assets:
    needs: [upload-to-release, upload-crux-code-zip]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Verify the full v1.1.79 asset set is present
        run: |
          expected=(
            "Crux-Client-Installer-All.zip"
            "Crux-Client-Installer.exe"
            "Crux-Client-Linux-x64.AppImage"
            "Crux-Client-Linux-x64.deb"
            "Crux-Client-Linux-x64.rpm"
            "Crux-Client-Linux-x64.tar.gz"
            "Crux-Client-Linux-x64.zip"
            "Crux-Client-Mac-x64.dmg"
            "Crux-Client-Mac-x64.zip"
          )
          actual=$(gh release view "$TAG" --repo Dev-Reds/crux-client --json assets --jq '.assets[].name')
          missing=0
          for a in "${expected[@]}"; do
            if echo "$actual" | grep -Fxq "$a"; then
              echo "OK   $a"
            else
              echo "MISS $a"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Release $TAG is missing required assets"
            exit 1
          fi
          echo "All v1.1.79 assets present on $TAG"

  upload-to-website-nuxt:
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'workflow_dispatch' && inputs.upload-to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Crux-Client-*
          merge-multiple: true
      - name: Upload to external repo release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG="${{ inputs.release-tag }}"
          for f in *.exe *.zip *.tar.gz *.dmg *.AppImage *.deb *.rpm; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber -R "${{ inputs.upload-to }}" || true
          done

  upload-crux-code-zip:
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create crux_code.zip
        run: |
          # actions/checkout schreibt einen Auth-Header in .git/config - der darf
          # nicht im oeffentlichen Source-Zip landen (sonst Duplicate-Header bei Push).
          git config --local --unset-all http.https://github.com/.extraheader || true
          zip --symlinks -9 -r crux_code.zip .
      - name: Upload to crux-code release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          gh release upload "$TAG" crux_code.zip --clobber -R "Dev-Reds/crux-code" || \
          gh release create "$TAG" crux_code.zip --title "Crux Code $TAG" --notes "Autogenerated source zip" -R "Dev-Reds/crux-code"
