name: Presence Server Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping presence server health endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://crux-presence.onrender.com/v1/health || echo 000)
            echo "attempt $i -> HTTP $status"
            if [ "$status" = "200" ]; then
              echo "presence server is awake"
              exit 0
            fi
            sleep 15
          done
          echo "presence server did not respond with 200 after 6 attempts"
          exit 1
